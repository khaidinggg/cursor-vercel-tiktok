<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Simple TikTok Search</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <main class="container">
      <div class="app-shell">
        <header class="hero">
          <p class="brand">TikTok Explorer</p>
          <h1>Find videos fast</h1>
          <p class="subtext">Search only. No watch history, no recommendations.</p>
        </header>

        <form id="search-form" class="search-row">
          <input
            id="search-input"
            type="text"
            placeholder="Search videos..."
            autocomplete="off"
            required
          />
          <button id="search-btn" type="submit">Search</button>
        </form>

        <p id="status" class="status"></p>
        <section id="results" class="results"></section>
        <div id="load-more-wrap" class="load-more-wrap hidden">
          <button id="load-more-btn" class="load-more-btn" type="button">Load more</button>
        </div>
      </div>
    </main>

    <script src="/app.js"></script>
  </body>
</html>
